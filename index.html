    <script>
      // 保留 Service Worker 注册，避免后台推送订阅在每次打开应用时被注销。
      // 仅清理旧缓存并主动检查 Service Worker 更新。
      (function () {
        var KEY = '__sw_updated_v61_one_push__';
        if (sessionStorage.getItem(KEY)) return;
        sessionStorage.setItem(KEY, '1');
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { try { r.update(); } catch (e) {} });
          }).catch(function () {});
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k !== 'cardtalk-v61-one-push'; }).map(function (k) { return caches.delete(k); }));
          }).catch(function () {});
        }
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script>
      // 备用：检测主 JS 加载失败时清除缓存并硬刷新
      (function () {
        var attempted = sessionStorage.getItem('__reload_attempted__');
        if (attempted) return;
        window.addEventListener('error', function (e) {
          var target = e.target;
          if (target && target.tagName === 'SCRIPT' && target.src) {
            sessionStorage.setItem('__reload_attempted__', '1');
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                  location.reload();
                });
              });
            } else {
              location.reload();
            }
          }
        }, true);
        setTimeout(function () {
          sessionStorage.removeItem('__reload_attempted__');
        }, 10000);
      })();
    </script>
  </body>
